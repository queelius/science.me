name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - run: uv sync
      - run: uv run pytest -q
      - run: uv run scienceme check
      # `standings --check` needs the forecast records, a cache kept outside git (spec 4.7):
      # run it where they are, after `scienceme predict --all` rebuilds them.
